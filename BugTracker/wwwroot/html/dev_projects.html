<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мои проекты — BugTracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/dev_projects.css?v=2" />
  </head>

  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <a class="brand" href="dev_projects.html">
          <span class="brand__logo">B</span>
          <span>BugTracker</span>
        </a>

        <nav class="sidebar__nav">
          <p class="sidebar__caption">Меню</p>

          <a class="nav-item nav-item--active" href="dev_projects.html">
            <img src="../assets/icons/folder.svg" alt="" />
            <span id="nav-projects-label">Мои проекты</span>
          </a>
        </nav>

        <div class="sidebar__profile">
          <div class="avatar">?</div>

          <div class="profile-info">
            <strong id="profile-name">Пользователь</strong>
            <span class="profile-role" id="profile-role"></span>
          </div>

          <div class="profile-actions">
            <button class="logout-button" id="logout-button" type="button">
              <img src="../assets/icons/log-out.svg" alt="" />
              <span>Выйти</span>
            </button>

            <a class="change-role" id="change-role" href="#">Сменить роль</a>
          </div>
        </div>
      </aside>

      <div class="content-area">
        <header class="topbar">
           <span id="topbar-title">Мои проекты</span>

          <button class="notification-button" type="button" aria-label="Уведомления">
            <img src="../assets/icons/bell.svg" alt="" />
          </button>
        </header>

        <main class="projects-page">
          <div class="page-header">
            <div>
              <h1 id="page-title">Мои проекты</h1>
              <p id="page-description">Проекты, которые вы создали или в которые вас добавили</p>
            </div>

            <button class="button button--primary create-button" id="create-project" type="button">
              + Создать проект
            </button>
          </div>

          <p id="projects-message" role="status" aria-live="polite"></p>

          <section
            class="projects-grid"
            id="projects-list"
            aria-label="Список проектов"
          ></section>

          <section class="empty-state" id="empty-state" hidden>
            <div class="empty-state__icon">
              <img src="../assets/icons/folder.svg" alt="" />
            </div>

            <h2 id="empty-title">У вас пока нет проектов</h2>
             <p id="empty-description">
              Создайте проект или дождитесь, когда вас добавят
              в существующий.
            </p>

            <button
              class="button button--primary"
              id="create-project-empty"
              type="button"
            >
              + Создать проект
            </button>
          </section>
        </main>
      </div>
    </div>

    <script src="../js/dev_projects.js"></script>
  </body>
</html>
