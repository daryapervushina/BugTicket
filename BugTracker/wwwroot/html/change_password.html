<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Смена пароля - BugTracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/change_password.css" />
  </head>
  <body class="login-layout">
    <div class="auth-card change-card">
      <div class="auth-header change-header">
        <div class="logo">B</div>
        <div class="auth-subtitle">BugTracker</div>
        <h1 class="auth-title">Смена пароля</h1>
        <p class="auth-description">
          Вы вошли с временным паролем. Задайте свой пароль, чтобы продолжить.
        </p>
      </div>

      <form class="auth-form change-form" novalidate>
        <div class="input-field" id="new-password-field">
          <label class="input-field__label" for="new-password"
            >Новый пароль *</label
          >
          <input
            class="input-field__control"
            type="password"
            id="new-password"
            name="newPassword"
            autocomplete="new-password"
            aria-describedby="new-password-error"
            required
          />
          <p class="input-field__error" id="new-password-error" hidden></p>
        </div>

        <div class="input-field" id="confirm-password-field">
          <label class="input-field__label" for="confirm-password"
            >Повторите пароль *</label
          >
          <input
            class="input-field__control"
            type="password"
            id="confirm-password"
            name="confirmPassword"
            autocomplete="new-password"
            aria-describedby="confirm-password-error"
            required
          />
          <p class="input-field__error" id="confirm-password-error" hidden></p>
        </div>

        <button
          type="submit"
          class="button button--primary button--block"
          disabled
        >
          Сохранить и войти
        </button>
      </form>
    </div>

    <script src="../js/change_password.js"></script>
  </body>
</html>
